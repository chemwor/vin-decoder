# fly.toml app configuration file generated for vin-decoder on 2026-08-26T20:39:47Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'vin-decoder'
primary_region = 'ams'

[build]

[env]
  PROFILE_TTL_SECONDS = '86400'
  VIN_DB_PATH = '/data/vin_cache.db'

[[mounts]]
  source = 'data'
  destination = '/data'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '10s'
    method = 'GET'
    path = '/health'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '512mb'
