# Fly.io configuration.
#
# Deliberately has no [build] section: images are built and pushed by GitHub
# Actions, and released with `flyctl deploy --image`. Letting Fly build would
# reintroduce the thing the pipeline exists to prevent -- an artefact reaching
# production that is not the one the tests ran against.

app = "vin-decoder"
primary_region = "iad"

[env]
  # Matches the volume mount below. Also set in the Dockerfile; repeated here
  # because this file is what actually configures the running machine, and a
  # reader should not have to open the Dockerfile to learn where data lives.
  VIN_DB_PATH = "/data/vin_cache.db"

  # Recall campaigns are announced against old vehicles continuously, so the
  # year/make/model profile cache expires. VIN decodes do not: CACHE_TTL_SECONDS
  # stays at its default of 0 (never).
  PROFILE_TTL_SECONDS = "86400"

[http_service]
  # The container binds ${PORT:-8000} and Fly does not inject PORT, so this
  # must stay 8000 to match the Dockerfile's fallback.
  internal_port = 8000
  force_https = true

  # The cache lives on a volume, so a stopped machine loses nothing and a cold
  # start costs one NHTSA fetch per uncached VIN. Set min_machines_running = 1
  # if p99 latency on the first request after idle matters more than the cost.
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    # /health answers only if SQLite answers, so this is a readiness check
    # rather than a liveness one -- a machine with an unreadable cache is
    # correctly removed from rotation instead of silently serving errors.
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"
    method = "GET"
    path = "/health"

[mounts]
  source = "vin_cache"
  destination = "/data"

# NOTE ON SCALING: a Fly volume is attached to one machine. Scale beyond a
# single machine and each gets its own volume, so you get N independent caches
# with N times the NHTSA traffic and no shared invalidation -- /remove would
# evict from whichever machine served it and no other. This is the same
# limitation recorded in NOTES.md, just made concrete by the platform: the fix
# is a shared cache (Postgres or Redis), not more machines.
[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
