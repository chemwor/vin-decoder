[project]
name = "vin-decoder"
version = "1.0.0"
description = "FastAPI VIN decoder backed by the NHTSA vPIC API with a SQLite cache"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "strict"
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
